<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fanavid Smart Load - Premium</title>
    <style>
        body { margin: 0; display: flex; height: 100vh; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; overflow: hidden; background: #f0f2f5; }
        .sidebar { width: 380px; padding: 20px; overflow-y: auto; background: #fff; border-right: 1px solid #ddd; z-index: 10; box-shadow: 2px 0 10px rgba(0,0,0,0.1); }
        #canvas-3d { flex-grow: 1; background: #e0e0e0; position: relative; }
        
        h2 { color: #1a237e; margin-top: 0; font-size: 22px; }
        .section-title { font-weight: bold; margin: 20px 0 10px; color: #2e7d32; border-bottom: 2px solid #eee; font-size: 13px; text-transform: uppercase; }
        
        .grid-inputs { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 15px; }
        .grid-inputs label { display: block; font-size: 10px; font-weight: bold; color: #666; }
        
        input, select { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; box-sizing: border-box; }
        
        button { width: 100%; padding: 12px; margin-top: 10px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        #btn-adicionar { background: #1976d2; color: white; }
        #btn-adicionar:hover { background: #1565c0; }
        #btn-calcular { background: #2e7d32; color: white; margin-top: 20px; }
        #btn-calcular:hover { background: #1b5e20; }
        .btn-imprimir { background: #455a64; color: white; }

        .checkbox-container { display: flex; align-items: center; margin-top: 15px; background: #e8f5e9; padding: 10px; border-radius: 4px; border: 1px solid #c8e6c9; }
        .checkbox-container input { width: auto; margin-right: 10px; }

        #lista-carregamento { margin-top: 15px; background: #f9f9f9; padding: 10px; border-radius: 4px; border: 1px solid #ddd; display: none; }
        #itens-lista { padding: 0; list-style: none; margin: 0; }

        .controles-info { position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,0.7); color: white; padding: 12px; font-size: 11px; border-radius: 6px; pointer-events: none; line-height: 1.6; }
        
        @media print { .sidebar { display: none; } #canvas-3d { width: 100%; } }
    </style>
</head>
<body>

    <div class="sidebar">
        <h2>Fanavid Smart Load</h2>
        <p style="font-size: 11px; color: #888; margin-bottom: 20px;">Logística Inteligente | Margem Seg. 2%</p>

        <label style="font-weight: bold; font-size: 12px;">TIPO DE VEÍCULO:</label>
        <select id="veiculo" onchange="window.calcularCarga()">
            <option value="carreta_mg">Carreta MG (14.00m)</option>
            <option value="carreta">Carreta Padrão (13.50m)</option>
            <option value="truck">Caminhão Truck (8.00m)</option>
            <option value="toco">Caminhão Toco (7.00m)</option>
            <option value="vlc">Caminhão VLC (5.10m)</option>
        </select>

        <div class="section-title">📦 RACKS (FERRO)</div>
        <div class="grid-inputs">
            <div><label>ETHOS</label><input type="number" id="qEthos" value="0" min="0" onchange="window.calcularCarga()"></div>
            <div><label>JD</label><input type="number" id="qJuandi" value="0" min="0" onchange="window.calcularCarga()"></div>
            <div><label>KOMATSU</label><input type="number" id="qComax" value="0" min="0" onchange="window.calcularCarga()"></div>
        </div>

        <div class="section-title">🪵 CAIXAS (MADEIRA)</div>
        <div style="display: flex; gap: 8px;">
            <div style="flex: 3;">
                <label style="font-size: 10px; font-weight: bold;">MODELO</label>
                <select id="idCaixa">
                    <option value="">-- Selecione --</option>
                    <option value="N1">N1 (850x750)</option>
                    <option value="N2">N2 (1050x800)</option>
                    <option value="N5">N5 (1050x1050)</option>
                    <option value="N9">N9 (1250x850)</option>
                    <option value="N16">N16 (1250x1150)</option>
                    <option value="N17">N17 (1450x1050)</option>
                    <option value="N18">N18 (1450x1300)</option>
                    <option value="N19">N19 (1650x1050)</option>
                    <option value="N20">N20 (1650x1450)</option>
                    <option value="N21">N21 (1850x1050)</option>
                    <option value="N22">N22 (1850x1250)</option>
                    <option value="N23">N23 (2050x1250)</option>
                    <option value="N24">N24 (1800x630)</option>
                    <option value="N25">N25 (1800x800)</option>
                    <option value="N14">N14 (1700x1100)</option>
                    <option value="N8">N8 (2500x1350)</option>
                    <option value="N6">N6 (2000x2000)</option>
                </select>
            </div>
            <div style="flex: 1;">
                <label style="font-size: 10px; font-weight: bold;">QTD</label>
                <input type="number" id="qCaixas" value="1" min="1">
            </div>
        </div>
        <button type="button" id="btn-adicionar" onclick="window.adicionarItem()">➕ ADICIONAR À CARGA</button>

        <div id="lista-carregamento">
            <p style="font-size: 10px; font-weight: bold; color: #333; margin-bottom: 8px;">ITENS NO CARRINHO:</p>
            <ul id="itens-lista"></ul>
        </div>

        <div class="checkbox-container">
            <input type="checkbox" id="empilhado" onchange="window.calcularCarga()">
            <label for="empilhado" style="font-weight: bold; font-size: 12px; color: #1b5e20;">📂 USAR 2 ANDARES (STACK)</label>
        </div>

        <button type="button" id="btn-calcular" onclick="window.calcularCarga()">RECALCULAR TUDO</button>
        <button class="btn-imprimir" onclick="window.print()">IMPRIMIR RELATÓRIO</button>
    </div>

    <div id="canvas-3d">
        <div class="controles-info">
            <b>COMANDOS 3D:</b><br>
            🖱️ Botão Esquerdo: Rotacionar Câmera<br>
            🖱️ Botão Direito: Girar Peça (90°)<br>
            📦 Arraste as peças para ajustar
        </div>
    </div>

    <!-- Bibliotecas -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="script.js"></script>
</body>
</html>
